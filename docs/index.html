<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transmutation — a circle that draws itself</title>
<meta name="description" content="An alchemical array that constructs itself stroke by stroke, turns, and ignites. Click anywhere to draw another.">
<meta name="color-scheme" content="dark">
<style>
  :root {
    --bg: #05060f;
    --blood: #9e1330;
    --rose: #ff6b7d;
    --crimson: #ff2d46;
    --ink: #e8ecff;
    --muted: #8b93b8;
    --panel: rgba(14, 16, 34, 0.72);
    --line: rgba(255, 45, 70, 0.26);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; cursor: crosshair; }

  .panel {
    position: fixed; z-index: 3;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55);
  }
  #title { top: 18px; left: 18px; padding: 14px 18px; max-width: 340px; }
  #title h1 {
    margin: 0; font-size: 17px; letter-spacing: 0.30em; text-transform: uppercase;
    background: linear-gradient(92deg, var(--crimson), var(--rose) 70%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #title p { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; }
  #title kbd {
    font: 11px ui-monospace, Consolas, monospace;
    background: rgba(255,45,70,.14); border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 5px; color: var(--ink);
  }
  #hud {
    top: 18px; right: 18px; padding: 12px 14px;
    font: 11.5px/1.7 ui-monospace, Consolas, monospace; color: var(--muted); min-width: 168px;
  }
  #hud b { color: var(--ink); font-weight: 600; float: right; margin-left: 14px; }

  #controls {
    bottom: 18px; left: 50%; transform: translateX(-50%);
    padding: 12px 16px; display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap; justify-content: center; max-width: min(980px, calc(100vw - 36px));
  }
  .ctl { display: flex; flex-direction: column; gap: 4px; min-width: 104px; }
  .ctl label {
    font: 10px/1 ui-monospace, Consolas, monospace; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
    display: flex; justify-content: space-between; gap: 10px;
  }
  .ctl label span { color: var(--crimson); }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
    border-radius: 2px; background: rgba(255,45,70,.3); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: var(--crimson); cursor: pointer; box-shadow: 0 0 10px var(--crimson);
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border: 0; border-radius: 50%;
    background: var(--crimson); cursor: pointer; box-shadow: 0 0 10px var(--crimson);
  }
  .sep { width: 1px; align-self: stretch; background: var(--line); }
  .btns { display: flex; gap: 7px; flex-wrap: wrap; }
  button {
    font: 11px ui-monospace, Consolas, monospace; letter-spacing: 0.06em;
    color: var(--ink); background: rgba(255,45,70,.12);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px;
    cursor: pointer; transition: background .15s, border-color .15s, transform .1s;
    white-space: nowrap;
  }
  button:hover { background: rgba(255,107,125,.22); border-color: var(--rose); }
  button:active { transform: translateY(1px); }
  button[aria-pressed="true"] { background: rgba(255,107,125,.28); border-color: var(--rose); }
  a.more { color: var(--rose); text-decoration: none; border-bottom: 1px dotted var(--rose); }

  #hint {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 3;
    color: var(--muted); font-size: 12px; pointer-events: none; opacity: 0;
    transition: opacity .4s; text-align: center; text-shadow: 0 2px 12px #05060f;
  }
  #hint.show { opacity: 1; }

  @media (max-width: 900px) {
    #title { max-width: none; right: 18px; }
    #title p { display: none; }
    #hud { display: none; }
    .sep { display: none; }
    #controls { gap: 11px; padding: 10px 12px; }
  }
</style>
</head>
<body>

<canvas id="c" aria-label="An alchemical transmutation circle drawing itself and igniting"></canvas>

<div class="panel" id="title">
  <h1>Transmutation</h1>
  <p>A circle built the way it would be drawn &mdash; centre, ring, inscribed
     hexagram, runes &mdash; then set alight.
     <kbd>click</kbd> draw another &middot; <kbd>space</kbd> ignite &middot;
     <kbd>R</kbd> clear &middot; <a class="more" href="lab.html">the rest &rarr;</a></p>
</div>

<div class="panel" id="hud">
  <div>arrays <b id="hN">0</b></div>
  <div>strokes <b id="hS">0</b></div>
  <div>fps <b id="hF">0</b></div>
</div>

<div id="hint"></div>

<div class="panel" id="controls">
  <div class="ctl">
    <label>divisions <span id="vD">60</span></label>
    <input type="range" id="sD" min="12" max="120" step="1" value="60">
  </div>
  <div class="ctl">
    <label>rotation <span id="vR">1.00</span></label>
    <input type="range" id="sR" min="0" max="4" step="0.05" value="1">
  </div>
  <div class="ctl">
    <label>build <span id="vB">1.00</span></label>
    <input type="range" id="sB" min="0.25" max="3" step="0.05" value="1">
  </div>
  <div class="sep"></div>
  <div class="btns">
    <button id="bPal">palette: crimson</button>
    <button id="bGlow" aria-pressed="true">glow</button>
    <button id="bAuto" aria-pressed="true">auto&#8209;ignite</button>
  </div>
  <div class="sep"></div>
  <div class="btns">
    <button id="bFire">transmute</button>
    <button id="bClear">clear</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');

  // Crimson is monochrome on purpose: ring and inscribed figure separate by
  // lightness, since there is no second hue to reach for without leaving red.
  // The spark stays near-white so ignition reads as heat, not just more red.
  const PALETTES = {
    crimson: { ring: '#ff2d46', inner: '#ff6b7d', spark: '#fff2f4', halo: '255,45,70' },
    ember:   { ring: '#ffd166', inner: '#4cc9f0', spark: '#ffffff', halo: '255,209,102' },
    verdant: { ring: '#8bffa8', inner: '#eaff6b', spark: '#ffffff', halo: '120,255,160' },
    ice:     { ring: '#9ad8ff', inner: '#c9b4ff', spark: '#ffffff', halo: '154,216,255' }
  };
  const NAMES = Object.keys(PALETTES);

  const S = { div: 60, rot: 1, build: 1, pal: 0, glow: true, auto: true };
  let W = 0, H = 0, DPR = 1;

  // Checked once per frame rather than driven by a resize event or a
  // ResizeObserver. An observer on the document feeds back -- resizing the
  // canvas changes layout, which refires the observer, which re-seeds -- and a
  // resize event never arrives at all if the first layout happened before the
  // viewport had a size. Polling two integers is cheaper than either.
  function ensureSize() {
    if (!innerWidth || !innerHeight) return false;
    if (innerWidth === W && innerHeight === H) return false;
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    return true;
  }

  /* ------------------------------------------------------------- one array */
  // Progress is kept as a single age in seconds and every stroke reads its own
  // window out of it, so the build order is declared once, here, rather than
  // being threaded through a state machine.
  const STAGES = [
    ['outer',  0.00, 1.05],
    ['outer2', 0.30, 1.35],
    ['runes',  0.70, 2.05],
    ['inner',  0.95, 2.05],
    ['hex',    1.50, 3.00],
    ['core',   2.45, 3.25],
    ['spokes', 2.70, 3.60],
    ['nodes',  3.10, 3.85]
  ];
  const BUILD_END = 3.85;

  function seg(age, i) {
    const [, a, b] = STAGES[i];
    return Math.max(0, Math.min(1, (age - a) / (b - a)));
  }

  class Array_ {
    constructor(x, y, r) {
      this.x = x; this.y = y; this.r = r;
      this.age = 0; this.fire = -1; this.dead = false;
      this.div = Math.max(8, Math.round(S.div * Math.min(1, r / 150)));
      this.seed = Math.random() * 6.283;
    }
    ignite() { if (this.age > BUILD_END * 0.6 && this.fire < 0) this.fire = 0; }
    step(dt) {
      this.age += dt * S.build;
      if (this.fire >= 0) this.fire += dt;
      if (this.auto !== false && S.auto && this.fire < 0 && this.age > BUILD_END + 2.2) this.ignite();
      if (this.fire > 2.6) { this.dead = true; }
    }
    draw(t) {
      const P = PALETTES[NAMES[S.pal]];
      const { x, y, r } = this;
      const a = this.age;
      // the flare rides on top of everything and fades the array out with it
      const f = this.fire < 0 ? 0 : Math.max(0, 1 - Math.abs(this.fire - 0.55) / 0.75);
      const gone = this.fire < 0 ? 1 : Math.max(0, 1 - Math.max(0, this.fire - 1.2) / 1.4);
      ctx.save();
      ctx.globalAlpha = gone;
      ctx.lineCap = 'round';
      if (S.glow) { ctx.shadowBlur = 14 + 40 * f; ctx.shadowColor = 'rgba(' + P.halo + ',0.9)'; }

      const spin = t * 0.12 * S.rot + this.seed;
      arc(x, y, r, seg(a, 0), P.ring, 2 + 2.5 * f);
      arc(x, y, r - 10, seg(a, 1), P.ring, 1, 0.45);

      // rune band, turning
      const pr = seg(a, 2), n = this.div;
      ctx.strokeStyle = P.ring; ctx.globalAlpha = gone * 0.85; ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        if (i / n > pr) break;
        const ang = spin + i * 6.28318 / n;
        const r0 = r - (i % 3 === 0 ? 11 : 6.5), r1 = r - 1.5;
        ctx.moveTo(x + r0 * Math.cos(ang), y + r0 * Math.sin(ang));
        ctx.lineTo(x + r1 * Math.cos(ang), y + r1 * Math.sin(ang));
      }
      ctx.stroke();
      ctx.globalAlpha = gone;

      const ri = r * 0.60, rc = r * 0.22;
      arc(x, y, ri, seg(a, 3), P.ring, 1.4, 0.75);

      // hexagram, counter-turning
      const ph = seg(a, 4), hs = -t * 0.075 * S.rot - this.seed;
      ctx.strokeStyle = P.inner; ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
      for (let k = 0; k < 2; k++) {
        const off = hs + k * 1.0472;
        const pts = [];
        for (let i = 0; i <= 3; i++) {
          const ang = off + i * 2.0944;
          pts.push([x + ri * Math.cos(ang), y + ri * Math.sin(ang)]);
        }
        partial(pts, Math.max(0, Math.min(1, ph * 2 - k)));
      }

      arc(x, y, rc, seg(a, 5), P.inner, 1.4, 0.9);

      // spokes and vertex nodes
      const ps = seg(a, 6);
      ctx.strokeStyle = P.inner; ctx.globalAlpha = gone * 0.5; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let k = 0; k < 6; k++) {
        if (k / 6 > ps) break;
        const ang = hs + k * 1.0472;
        ctx.moveTo(x + rc * Math.cos(ang), y + rc * Math.sin(ang));
        ctx.lineTo(x + ri * Math.cos(ang), y + ri * Math.sin(ang));
      }
      ctx.stroke();
      const pn = seg(a, 7);
      ctx.globalAlpha = gone * pn;
      for (let k = 0; k < 6; k++) {
        const ang = hs + k * 1.0472;
        const nx = x + ri * Math.cos(ang), ny = y + ri * Math.sin(ang);
        ctx.beginPath(); ctx.arc(nx, ny, 5, 0, 6.28318);
        ctx.fillStyle = 'rgba(' + P.halo + ',0.25)'; ctx.fill();
        ctx.strokeStyle = P.ring; ctx.lineWidth = 1.2; ctx.stroke();
      }
      ctx.globalAlpha = gone;

      // the arc that races the circumference on ignition
      if (this.fire >= 0 && this.fire < 1.1) {
        const p = this.fire / 1.1;
        const head = -1.5708 + p * 6.28318;
        ctx.strokeStyle = P.spark;
        ctx.lineWidth = 2.6 + 3 * f;
        ctx.shadowBlur = S.glow ? 26 : 0;
        ctx.beginPath();
        ctx.arc(x, y, r, head - 0.9, head);
        ctx.stroke();
      }
      if (f > 0.01) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r * 1.5);
        g.addColorStop(0, 'rgba(' + P.halo + ',' + (0.42 * f) + ')');
        g.addColorStop(1, 'rgba(' + P.halo + ',0)');
        ctx.fillStyle = g; ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.arc(x, y, r * 1.5, 0, 6.28318); ctx.fill();
      }
      ctx.restore();

      function arc(cx, cy, rr, p, col, w, al) {
        if (p <= 0) return;
        ctx.globalAlpha = gone * (al === undefined ? 1 : al);
        ctx.strokeStyle = col; ctx.lineWidth = w + (w > 1.5 ? 2.5 * f : 0);
        ctx.beginPath();
        ctx.arc(cx, cy, rr, -1.5708, -1.5708 + 6.28318 * p);
        ctx.stroke();
        ctx.globalAlpha = gone;
      }
      function partial(pts, p) {
        if (p <= 0) return;
        let total = 0;
        for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
        let want = total * p;
        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length && want > 0; i++) {
          const dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
          const L = Math.hypot(dx, dy);
          const q = Math.min(1, want / L);
          ctx.lineTo(pts[i - 1][0] + dx * q, pts[i - 1][1] + dy * q);
          want -= L;
        }
        ctx.stroke();
      }
    }
  }

  /* ---------------------------------------------------------------- scene */
  let arrays = [], seeded = false;
  function seed() {
    arrays = [];
    const r = Math.min(W, H) * 0.30;
    const main = new Array_(W / 2, H / 2, r);
    main.auto = true;
    arrays.push(main);
    for (const s of [-1, 1]) {
      const a = new Array_(W / 2 + s * (r + 30 + r * 0.42), H / 2, r * 0.36);
      a.age = -0.5; arrays.push(a);
    }
  }

  let hintTimer = 0;
  function hint(text) {
    const el = $('hint'); el.textContent = text; el.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => el.classList.remove('show'), 5200);
  }

  cv.addEventListener('pointerdown', e => {
    const r = 46 + Math.random() * Math.min(W, H) * 0.16;
    arrays.push(new Array_(e.clientX, e.clientY, r));
    if (arrays.length > 26) arrays.splice(0, arrays.length - 26);
  });

  $('bFire').addEventListener('click', () => { arrays.forEach(a => a.ignite()); });
  $('bClear').addEventListener('click', () => { seed(); });
  $('bPal').addEventListener('click', () => {
    S.pal = (S.pal + 1) % NAMES.length;
    $('bPal').textContent = 'palette: ' + NAMES[S.pal];
  });
  $('bGlow').addEventListener('click', () => {
    S.glow = !S.glow; $('bGlow').setAttribute('aria-pressed', String(S.glow));
  });
  $('bAuto').addEventListener('click', () => {
    S.auto = !S.auto; $('bAuto').setAttribute('aria-pressed', String(S.auto));
    hint(S.auto ? 'arrays ignite on their own once drawn' : 'arrays stay drawn until you transmute');
  });
  function slider(id, out, key, fmt) {
    $(id).addEventListener('input', e => { S[key] = +e.target.value; $(out).textContent = fmt(S[key]); });
    $(out).textContent = fmt(S[key]);
  }
  slider('sD', 'vD', 'div', v => v.toFixed(0));
  slider('sR', 'vR', 'rot', v => v.toFixed(2));
  slider('sB', 'vB', 'build', v => v.toFixed(2));

  addEventListener('keydown', e => {
    if (e.target !== document.body) return;
    if (e.code === 'Space') { e.preventDefault(); arrays.forEach(a => a.ignite()); }
    else if (e.key.toLowerCase() === 'r') seed();
  });

  let last = performance.now(), fps = 60, frame = 0;
  function tick(now) {
    requestAnimationFrame(tick);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    ensureSize();
    // Seed once, the first frame the viewport actually has a size. Re-seeding
    // whenever the canvas resizes looks tidy until the host twitches its height
    // by a pixel every frame, and the build restarts forever.
    if (!W || !H) return;
    if (!seeded) { seed(); seeded = true; }
    fps += (1 / Math.max(dt, 1e-4) - fps) * 0.08;
    const t = now / 1000;

    ctx.fillStyle = '#05060f';
    ctx.fillRect(0, 0, W, H);
    for (const a of arrays) { a.step(dt); a.draw(t); }
    arrays = arrays.filter(a => !a.dead);
    if (!arrays.length) seed();

    if ((frame++ & 15) === 0) {
      $('hN').textContent = arrays.length;
      $('hS').textContent = arrays.reduce((s, a) => s + 12 + a.div, 0);
      $('hF').textContent = fps.toFixed(0);
    }
  }

  ensureSize();
  requestAnimationFrame(tick);
  setTimeout(() => hint('click anywhere to draw another array'), 2600);
})();
</script>
</body>
</html>
